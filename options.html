<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ossa - Settings</title>
  <style>
    :root {
      --bg-dark: #313338;
      --bg-panel: #2b2d31;
      --input-bg: #1e1f22;
      --text-normal: #dbdee1;
      --text-muted: #949ba4;
      --blurple: #5865f2;
      --blurple-hover: #4752c4;
      --error-red: #f23f43;
    }

    body {
      font-family: 'GG Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-normal);
      margin: 0;
      padding: 24px;
      width: 340px;
    }

    .container {
      background-color: var(--bg-panel);
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    h2 {
      font-size: 20px;
      font-weight: 600;
      color: #ffffff;
      margin-top: 0;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    input[type="text"], input[type="url"] {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid transparent;
      border-radius: 4px;
      color: var(--text-normal);
      padding: 10px 12px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--blurple);
      background-color: #111214;
    }

    button {
      background-color: var(--blurple);
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    button:hover {
      background-color: var(--blurple-hover);
    }

    #status {
      font-size: 13px;
      margin-top: 10px;
      text-align: center;
      min-height: 18px;
      color: #23a55a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Ossa Configuration</h2>
    
    <div class="form-group">
      <label for="url">Target Webpage URL</label>
      <input type="url" id="url" placeholder="https://example.com">
    </div>

    <div class="form-group">
      <label for="webhook">Discord Webhook URL</label>
      <input type="text" id="webhook" placeholder="https://discord.com/api/webhooks/...">
    </div>

    <button id="save">Save Changes</button>
    <div id="status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
